<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration | Online Quiz Management System</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Nav -->
  <nav class="navbar navbar-custom">
    <div class="container px-4">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <i class="bi bi-mortarboard-fill"></i>
        <span>QuizMaster</span>
      </a>
      <a href="login.html" class="btn btn-sm btn-outline-custom">
        <i class="bi bi-box-arrow-in-right me-1"></i> Already have an account? Sign In
      </a>
    </div>
  </nav>

  <!-- Register Form Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card-custom p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="stat-icon mx-auto mb-3" style="width: 56px; height: 56px;">
              <i class="bi bi-person-plus text-primary fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Create Student Account</h3>
            <p class="text-muted small">Register to participate in online tests and track your scores</p>
          </div>

          <div id="register-alert" class="alert alert-danger d-none" role="alert"></div>

          <form id="registerForm" onsubmit="handleRegisterSubmit(event)">
            <div class="mb-3">
              <label for="reg-name" class="form-label fw-semibold small text-dark">Full Name</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control border-start-0" id="reg-name" required placeholder="John Doe">
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-email" class="form-label fw-semibold small text-dark">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0" id="reg-email" required placeholder="john@student.com">
              </div>
            </div>

            <div class="mb-3">
              <label for="reg-password" class="form-label fw-semibold small text-dark">Password (min 6 characters)</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control border-start-0" id="reg-password" required minlength="6" placeholder="••••••••">
              </div>
            </div>

            <div class="mb-4">
              <label for="reg-confirm" class="form-label fw-semibold small text-dark">Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-shield-check"></i></span>
                <input type="password" class="form-control border-start-0" id="reg-confirm" required minlength="6" placeholder="••••••••">
              </div>
            </div>

            <button type="submit" id="btn-register" class="btn btn-primary-custom w-100 py-2 mb-3">
              <i class="bi bi-check2-circle me-1"></i> Complete Registration
            </button>
          </form>

          <div class="text-center mt-3 pt-2 border-top">
            <p class="small text-muted mb-0">
              Already enrolled? 
              <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign In to Account</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-custom mt-auto">
    <div class="container text-center text-muted small">
      Online Quiz Management System • Academic Full-Stack Java Implementation
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    async function handleRegisterSubmit(event) {
      event.preventDefault();
      const alertBox = document.getElementById('register-alert');
      alertBox.classList.add('d-none');

      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPass = document.getElementById('reg-confirm').value;

      if (password !== confirmPass) {
        alertBox.innerText = 'Passwords do not match.';
        alertBox.classList.remove('d-none');
        return;
      }

      const btn = document.getElementById('btn-register');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Creating account...';

      const res = await apiRequest('/auth/register', {
        method: 'POST',
        body: JSON.stringify({ name, email, password })
      });

      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Complete Registration';

      if (res.success && res.data) {
        Auth.setSession(res.data.token, res.data.user);
        showToast('Registration successful! Welcome.', 'success');
        setTimeout(() => {
          window.location.href = 'student-dashboard.html';
        }, 500);
      } else {
        alertBox.innerText = res.message || 'Registration failed.';
        alertBox.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
