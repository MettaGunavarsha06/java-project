<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Online Quiz Management System</title>
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Minimal Nav -->
  <nav class="navbar navbar-custom">
    <div class="container px-4">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <i class="bi bi-mortarboard-fill"></i>
        <span>QuizMaster</span>
      </a>
      <a href="index.html" class="btn btn-sm btn-outline-custom">
        <i class="bi bi-arrow-left me-1"></i> Back to Home
      </a>
    </div>
  </nav>

  <!-- Login Form Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <div class="card-custom p-4 p-md-5">
          <div class="text-center mb-4">
            <div class="stat-icon mx-auto mb-3" style="width: 56px; height: 56px;">
              <i class="bi bi-shield-lock text-primary fs-3"></i>
            </div>
            <h3 class="fw-bold text-dark mb-1">Welcome Back</h3>
            <p class="text-muted small">Sign in to your Student or Administrator account</p>
          </div>

          <!-- Alert message box -->
          <div id="login-alert" class="alert alert-danger d-none" role="alert"></div>

          <form id="loginForm" onsubmit="handleLoginSubmit(event)">
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold small text-dark">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control border-start-0" id="email" required placeholder="name@domain.com">
              </div>
            </div>

            <div class="mb-4">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label fw-semibold small text-dark mb-0">Password</label>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                <input type="password" class="form-control border-start-0" id="password" required placeholder="••••••••">
              </div>
            </div>

            <button type="submit" id="btn-login" class="btn btn-primary-custom w-100 py-2 mb-3">
              <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
          </form>

          <!-- Quick Fill Demo Accounts -->
          <div class="pt-3 border-top mt-3 text-center">
            <span class="small text-muted d-block mb-2 fw-semibold">Quick Demo Login (One-Click)</span>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-custom flex-fill py-1" onclick="fillCredentials('admin@quiz.com', 'admin123')">
                <i class="bi bi-person-gear text-primary me-1"></i> Admin
              </button>
              <button type="button" class="btn btn-sm btn-outline-custom flex-fill py-1" onclick="fillCredentials('alex@student.com', 'student123')">
                <i class="bi bi-person text-success me-1"></i> Student 1
              </button>
              <button type="button" class="btn btn-sm btn-outline-custom flex-fill py-1" onclick="fillCredentials('sophia@student.com', 'student123')">
                <i class="bi bi-person text-info me-1"></i> Student 2
              </button>
            </div>
          </div>

          <div class="text-center mt-4 pt-2">
            <p class="small text-muted mb-0">
              Don't have an account yet? 
              <a href="register.html" class="fw-bold text-primary text-decoration-none">Register as Student</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer-custom mt-auto">
    <div class="container text-center text-muted small">
      Online Quiz Management System • Academic Full-Stack Java Implementation
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    function fillCredentials(email, pass) {
      document.getElementById('email').value = email;
      document.getElementById('password').value = pass;
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const alertBox = document.getElementById('login-alert');
      alertBox.classList.add('d-none');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Authenticating...';

      const res = await apiRequest('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ email, password })
      });

      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';

      if (res.success && res.data) {
        Auth.setSession(res.data.token, res.data.user);
        showToast('Login successful! Redirecting...', 'success');

        const urlParams = new URLSearchParams(window.location.search);
        const redirect = urlParams.get('redirect');

        setTimeout(() => {
          if (redirect) {
            window.location.href = redirect;
          } else if (res.data.user.role === 'ADMIN') {
            window.location.href = 'admin-dashboard.html';
          } else {
            window.location.href = 'student-dashboard.html';
          }
        }, 500);
      } else {
        alertBox.innerText = res.message || 'Login failed. Check credentials.';
        alertBox.classList.remove('d-none');
      }
    }
  </script>
</body>
</html>
